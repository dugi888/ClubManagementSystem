services:
  postgres:
    image: postgres:17
    container_name: ClubPlatform-DB
    restart: unless-stopped
    environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: ClubPlatform
    ports:
        - "5433:5432"
    volumes:
      - ClubPlatform-data:/var/lib/postgresql/data
volumes: 
  ClubPlatform-data: